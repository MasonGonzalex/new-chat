<!-- filename: public/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智核 AI (Cloud-Based AI Chat)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
    <!-- 历史记录抽屉容器 -->
    <div id="history-drawer" class="sidebar-drawer">
        <div class="sidebar">
            <button id="new-chat-btn">新建对话</button>
            <ul id="session-list"></ul>
            <div id="user-info">
                <span id="username-display"></span>
                <button id="logout-btn">退出登录</button>
            </div>
        </div>
    </div>
    <div id="drawer-overlay" class="drawer-overlay"></div>
    
    <!-- Table of Contents Drawer -->
    <div id="toc-drawer" class="sidebar-drawer right">
        <!-- Table of Contents will be populated by JS -->
    </div>

    <!-- 主应用容器，默认隐藏 -->
    <div id="app-container" class="hidden">
        <header>
            <button id="history-toggle-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <h2 id="chat-title"></h2>
            <div class="select-wrapper">
                <select id="model-select"></select>
            </div>
            <button id="new-chat-btn-header">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button id="toc-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </button>
        </header>
        <main id="chat-box">
            <!-- Messages will be rendered here by JS -->
        </main>
        <footer>
            <div>
                <form id="chat-form">
                    <div>
                        <textarea id="user-input" placeholder="在这里输入你的问题... (Ctrl+Enter 发送)" rows="1"></textarea>
                        <button type="submit" id="send-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </form>
            </div>
        </footer>
    </div>

    <!-- 登录/注册模态框 -->
    <div id="auth-container" class="auth-overlay">
        <div class="auth-box">
            <h2 id="auth-title">登录</h2>
            <form id="auth-form">
                <input type="text" id="auth-username" placeholder="用户名" required>
                <input type="password" id="auth-password" placeholder="密码 (至少6位)" required>
                <button type="submit" id="auth-submit-btn">登录</button>
            </form>
            <p id="auth-message"></p>
            <a href="#" id="switch-auth-mode">没有账号？点击注册</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web-streams-polyfill@3.2.1/dist/polyfill.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
